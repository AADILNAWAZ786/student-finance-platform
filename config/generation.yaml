# Synthetic data generation config (ARCHITECTURE §11, DATABASE_DESIGN §7).
#
# Dataset content depends only on: seed + this resolved config + code (ARCHITECTURE P4).
# config_hash = SHA-256 of the canonical JSON of the *resolved* config (sorted keys, no
# whitespace). Changing any value here changes the hash and the data.
#
# Volumes below are FULL-scale baseline targets (DATABASE_DESIGN §7). A scale factor
# multiplies the transactional volumes (students, payments, award quota, anomalies);
# master data always stays full size (ARCHITECTURE §11.4: 20 programs, 12 terms, 7 types).

seed: 20261022
as_of_date: "2026-12-31"           # ARCHITECTURE D7: no business event after it
actor: datagen                     # DATABASE_DESIGN §3 StatusEventBase.actor

scales:
  starter: 0.01                    # 1 % of transactional volume
  full: 1.0

volumes:                           # full-scale exact targets (DATABASE_DESIGN §7)
  students: 10000
  payments: 50000
  awards_per_term: 5000            # D12 ranked quota (generation policy only)
  anomalies_per_type: 150          # 3 per type at starter scale
  anomalies_min_per_type: 3        # ARCHITECTURE §11.4

# --- master data ---------------------------------------------------------------------------
# 20 programs: 8 STEM, 12 with a lab (DATABASE_DESIGN §3 Program). tuition = INR per credit
# for a DOMESTIC student in SPRING (DATABASE_DESIGN §3 "Pricing").
