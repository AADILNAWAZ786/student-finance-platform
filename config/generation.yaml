  - {code: BTECH-EE, name: BTech Electrical Engineering, level: UG,     department: Engineering,         stem: true,  lab: true,  min: 15, max: 24, tuition: 11500}
  - {code: BSC-BIO,  name: BSc Biotechnology,           level: UG,      department: Life Sciences,       stem: true,  lab: true,  min: 12, max: 20, tuition: 9000}
